<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AICE 오프라인 응시장 사전 점검 가이드</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #f1f5f9;
      font-size: 16px;
      line-height: 1.55;
    }
    /* 현장 가독성 향상: 기존의 지나치게 작은 글씨를 한 단계씩 확대 */
    .text-\[10px\] { font-size: 0.75rem !important; line-height: 1.45 !important; }
    .text-\[11px\] { font-size: 0.8125rem !important; line-height: 1.5 !important; }
    .text-xs { font-size: 0.875rem !important; line-height: 1.55 !important; }
    .text-sm { font-size: 1rem !important; line-height: 1.55 !important; }
    .text-base { font-size: 1.125rem !important; line-height: 1.5 !important; }
    .text-lg { font-size: 1.25rem !important; line-height: 1.45 !important; }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .gradient-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-target {
      animation: pulse-ring 1.8s infinite ease-in-out;
    }
    @keyframes bounce-pointer {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-bounce-pointer {
      animation: bounce-pointer 1.2s infinite;
    }
    .ppt-figure img { display:block; width:100%; height:auto; }
    .ppt-hotspot {
      position:absolute; border:3px solid #ef4444; border-radius:10px;
      background:rgba(239,68,68,.10); box-shadow:0 0 0 4px rgba(255,255,255,.88), 0 0 18px rgba(239,68,68,.65);
      pointer-events:none;
    }
    .ppt-hotspot::after {
      content:attr(data-label); position:absolute; left:0; top:-30px;
      padding:4px 8px; border-radius:7px; background:#dc2626; color:#fff;
      font-size:13px; line-height:1.35; font-weight:800; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.25);
    }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white; color: black; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icon component helper
    const Icon = ({ name, size = 18, className = "" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
    };

    const DESKTOP_NETWORK_IMAGE = 'assets/desktop-network.webp';

    const DesktopNetworkFigure = ({ focus }) => {
      const regions = {
        isp: [
          { left:'1%', top:'6%', width:'91%', height:'19%', label:'① 통신사 회선·대역폭' },
        ],
        firewall: [
          { left:'1%', top:'20%', width:'95%', height:'24%', label:'② 기관 보안영역·차단정책' },
        ],
        switch: [
          { left:'13%', top:'44%', width:'82%', height:'25%', label:'③ 스위치·UTP 연결' },
        ],
        pc: [
          { left:'2%', top:'68%', width:'87%', height:'30%', label:'④ PC 랜카드·연결상태' },
        ],
      };
      const selected = focus ? (regions[focus] || []) : [];
      return (
        <figure class="ppt-figure bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div class="relative bg-white overflow-hidden">
            <img src={DESKTOP_NETWORK_IMAGE} alt="데스크탑 시험장 유선 네트워크 구성도" />
            {selected.map((h, index) => (
              <span key={index} class="ppt-hotspot pulse-target" data-label={h.label} style={{left:h.left, top:h.top, width:h.width, height:h.height}}></span>
            ))}
          </div>
          <figcaption class="px-3 py-2 bg-red-50 border-t border-red-100 text-[11px] text-red-800 font-bold flex items-center gap-1.5">
            <Icon name="map-pin" size={14} />
            {selected.length ? '선택한 점검 단계의 빨간 표시 구간을 현장에서 확인하세요.' : '오른쪽 점검 항목을 선택하면 이 그림에 점검 구간이 표시됩니다.'}
          </figcaption>
        </figure>
      );
    };

    const WIRELESS_NETWORK_IMAGE = 'assets/wireless-network.webp';

    const LOAD_TEST_IMAGE = 'assets/load-test.webp';
    const FAST_TEST_IMAGE = 'assets/fast-test.webp';

    const PLATFORM_TEST_IMAGE = 'assets/platform-test.webp';

    const GuideImage = ({ src, alt, masks = [] }) => (
      <figure class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <div class="relative bg-white flex justify-center overflow-hidden">
          <img src={src} alt={alt} class="block w-full h-auto object-contain bg-white" />
          {masks.map((mask, index) => (
            <span
              key={index}
              class="absolute bg-white pointer-events-none"
              aria-hidden="true"
              style={mask}
            ></span>
          ))}
        </div>
      </figure>
    );

    const WirelessNetworkFigure = ({ focus }) => {
      const regions = {
        mesh:   { left:'1%', top:'6%', width:'34%', height:'91%', label:'① AP Mesh · 약 60명' },
        multi:  { left:'36%', top:'6%', width:'32%', height:'91%', label:'② AP 2대 분산 · 약 40명' },
        single: { left:'69%', top:'6%', width:'30%', height:'91%', label:'③ 단일 AP · 약 25명' },
      };
      const selected = focus ? regions[focus] : null;
      return (
        <figure class="ppt-figure bg-white rounded-xl border border-slate-200 overflow-hidden mt-5 mx-auto max-w-4xl">
          <div class="relative bg-white overflow-hidden">
            <img src={WIRELESS_NETWORK_IMAGE} alt="무선 인터넷 AP 구성 방식 3가지 비교도" />
            {selected && (
              <span class="ppt-hotspot pulse-target" data-label={selected.label} style={{left:selected.left, top:selected.top, width:selected.width, height:selected.height}}></span>
            )}
          </div>
          <figcaption class="px-3 py-2 bg-red-50 border-t border-red-100 text-xs text-red-800 font-bold flex items-center gap-1.5">
            <Icon name="map-pin" size={16} />
            {selected ? '선택한 무선 구성의 빨간 표시 영역과 수용 인원을 확인하세요.' : '위 추천 구성을 선택하면 이 그림에서 해당 영역이 표시됩니다.'}
          </figcaption>
        </figure>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('net'); // 'net', 'speed', 'access', 'checklist'
      const [netType, setNetType] = useState('wired'); // 'wired', 'wireless'
      const [activeTarget, setActiveTarget] = useState(null); // Highlighted diagram element

      // Speed Calculator State
      const [dlSpeed, setDlSpeed] = useState('');
      const [ulSpeed, setUlSpeed] = useState('');

      // Checklist State
      const [checks, setChecks] = useState({
        c1: false, // ISP Line
        c2: false, // Firewall
        c3: false, // Switch & UTP
        c4pc: false, // PC NIC
        c4: false, // AP Setup (for wireless)
        c5: false, // YouTube 2K Load Test
        c6: false, // Fast.com Speed Test
        c7: false, // Platform Login
        c8: false, // Proctoring Environment Check
        c9: false, // Sample Test Question Load
      });

      const toggleCheck = (key) => {
        setChecks(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const networkCheckKeys = netType === 'wired'
        ? ['c1', 'c2', 'c3', 'c4pc']
        : ['c4'];
      const activeCheckKeys = [...networkCheckKeys, 'c5', 'c6', 'c7', 'c8', 'c9'];
      const networkStepCount = networkCheckKeys.length;
      const completedCount = activeCheckKeys.filter(key => checks[key]).length;
      const totalChecks = activeCheckKeys.length;
      const progressPercent = Math.round((completedCount / totalChecks) * 100);

      const resetChecklist = () => {
        if (confirm('점검 내역을 초기화하시겠습니까?')) {
          setChecks({
            c1: false, c2: false, c3: false, c4pc: false, c4: false,
            c5: false, c6: false, c7: false, c8: false, c9: false
          });
          setDlSpeed('');
          setUlSpeed('');
        }
      };

      return (
        <div class="min-h-screen flex flex-col max-w-7xl mx-auto shadow-2xl bg-white border-x border-slate-200">
          
          {/* Header Bar - Responsive for PC & Mobile */}
          <header class="gradient-header text-white p-4 md:p-6 sticky top-0 z-30 shadow-lg no-print">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-blue-500/20 text-blue-300 border border-blue-400/30">
                    <Icon name="shield-check" size={14} /> AICE 오프라인 시험 관리자 및 현장 시설관리자용
                  </span>
                  <span class="text-xs text-slate-400 hidden sm:inline">AICE 오프라인 시험장 환경 검사 kit v1.0</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight text-white flex items-center gap-2">
                  AICE 오프라인 응시장 사전 점검 가이드
                </h1>
                <p class="text-xs md:text-sm text-slate-300 mt-1">
                  그림 및 표시 화살표를 확인하며 순서대로 점검해 주세요. (클릭 시 점검 대상 위치 강조)
                </p>
              </div>

              {/* Progress Box */}
              <div class="bg-slate-800/90 border border-slate-700/80 p-3.5 rounded-2xl md:w-80 shrink-0">
                <div class="flex justify-between items-center text-xs mb-1.5 font-medium">
                  <span class="text-slate-300">
                    전체 점검 진행률
                    <span class="ml-1 text-[11px] text-slate-400">
                      ({netType === 'wired' ? '유선 환경' : '무선 AP 환경'})
                    </span>
                  </span>
                  <span class="text-blue-400 font-bold text-sm">{completedCount} / {totalChecks} 완료 ({progressPercent}%)</span>
                </div>
                <div class="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700">
                  <div 
                    class="h-full bg-gradient-to-r from-blue-500 via-indigo-400 to-emerald-400 transition-all duration-300 rounded-full"
                    style={{ width: `${progressPercent}%` }}
                  ></div>
                </div>
              </div>

            </div>
          </header>

          {/* Navigation Bar */}
          <nav class="bg-slate-900 text-slate-300 border-b border-slate-800 sticky top-[98px] md:top-[106px] z-20 shadow-md flex overflow-x-auto no-scrollbar no-print">
            <button 
              onClick={() => { setActiveTab('net'); setActiveTarget(null); }}
              class={`flex-1 min-w-[130px] py-3.5 px-4 text-xs md:text-sm font-bold whitespace-nowrap border-b-2 flex items-center justify-center gap-2 transition-all ${
                activeTab === 'net' ? 'border-blue-500 text-white bg-blue-600/20' : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icon name="network" size={18} />
              1. 네트워크 및 장비 점검
            </button>

            <button 
              onClick={() => { setActiveTab('speed'); setActiveTarget(null); }}
              class={`flex-1 min-w-[130px] py-3.5 px-4 text-xs md:text-sm font-bold whitespace-nowrap border-b-2 flex items-center justify-center gap-2 transition-all ${
                activeTab === 'speed' ? 'border-blue-500 text-white bg-blue-600/20' : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icon name="gauge" size={18} />
              2. 부하 & 속도 테스트
            </button>

            <button 
              onClick={() => { setActiveTab('access'); setActiveTarget(null); }}
              class={`flex-1 min-w-[130px] py-3.5 px-4 text-xs md:text-sm font-bold whitespace-nowrap border-b-2 flex items-center justify-center gap-2 transition-all ${
                activeTab === 'access' ? 'border-blue-500 text-white bg-blue-600/20' : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icon name="monitor-check" size={18} />
              3. 시험 시스템 접속
            </button>

            <button 
              onClick={() => { setActiveTab('checklist'); setActiveTarget(null); }}
              class={`flex-1 min-w-[130px] py-3.5 px-4 text-xs md:text-sm font-bold whitespace-nowrap border-b-2 flex items-center justify-center gap-2 transition-all ${
                activeTab === 'checklist' ? 'border-blue-500 text-white bg-blue-600/20' : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              <Icon name="check-square" size={18} />
              4. 통합 체크리스트
            </button>
          </nav>

          {/* Main Layout Area */}
          <main class="p-4 md:p-6 flex-1 bg-slate-50">

            {/* ============================================================ */}
            {/* TAB 1: 네트워크 및 장비 점검 */}
            {/* ============================================================ */}
            {activeTab === 'net' && (
              <div class="space-y-6">
                
                {/* Mode Selector Header */}
                <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-3">
                  <div class="flex items-center gap-2 text-slate-800 font-bold text-sm">
                    <Icon name="sliders" size={18} class="text-blue-600" />
                    응시장 환경 유형 선택:
                  </div>
                  <div class="bg-slate-100 p-1 rounded-xl flex gap-1 w-full sm:w-auto">
                    <button
                      onClick={() => { setNetType('wired'); setActiveTarget(null); }}
                      class={`flex-1 sm:flex-initial px-4 py-2 text-xs md:text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${
                        netType === 'wired' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icon name="monitor" size={16} /> 데스크탑 (유선 환경)
                    </button>
                    <button
                      onClick={() => { setNetType('wireless'); setActiveTarget(null); }}
                      class={`flex-1 sm:flex-initial px-4 py-2 text-xs md:text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${
                        netType === 'wireless' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      <Icon name="wifi" size={16} /> 노트북 (무선 AP 환경)
                    </button>
                  </div>
                </div>

                {/* WIRED ENVIRONMENT VIEW */}
                {netType === 'wired' && (
                  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    
                    {/* Visual Interactive Diagram Card (7 cols on PC) */}
                    <div class="lg:col-span-7 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                      <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                        <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                          <Icon name="map" size={18} class="text-blue-600" /> 
                          데스크탑 유선 네트워크 점검 위치도
                        </h3>
                        <span class="text-[11px] text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full font-medium">
                          💡 구간별 단계를 선택하면 그림에 점검 구간이 표시됩니다.
                        </span>
                      </div>

                      <DesktopNetworkFigure focus={activeTarget} />

                      {/* Interactive Visual Canvas / Diagram */}
                      <div class="hidden">
                        
                        {/* Background Grid Pattern */}
                        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:16px_16px]"></div>

                        {/* Top: ISP Cloud */}
                        <div 
                          onClick={() => setActiveTarget('isp')}
                          class={`cursor-pointer transition-all duration-300 p-3 rounded-xl border relative z-10 flex items-center justify-between ${
                            activeTarget === 'isp' 
                              ? 'bg-blue-600/40 border-blue-400 ring-4 ring-blue-500/40 scale-[1.02]' 
                              : 'bg-slate-800/80 border-slate-700 hover:border-slate-500'
                          }`}
                        >
                          <div class="flex items-center gap-3">
                            <div class="p-2.5 rounded-lg bg-blue-500/20 text-blue-400 border border-blue-500/30">
                              <Icon name="cloud" size={24} />
                            </div>
                            <div>
                              <div class="text-xs text-blue-300 font-semibold">1단계: 인터넷 통신사 회선 (ISP)</div>
                              <div class="text-sm font-bold">KT / SKT / LGU+ 회선</div>
                            </div>
                          </div>
                          {activeTarget === 'isp' && (
                            <span class="bg-blue-500 text-white text-[11px] font-bold px-2.5 py-1 rounded-full animate-bounce-pointer">
                              👈 점검 대상
                            </span>
                          )}
                        </div>

                        {/* Connection Line 1 */}
                        <div class="h-6 flex justify-center items-center my-1 relative z-0">
                          <div class={`w-1 h-full transition-colors ${activeTarget === 'isp' || activeTarget === 'firewall' ? 'bg-blue-400' : 'bg-slate-700'}`}></div>
                        </div>

                        {/* Middle: Firewall Shield */}
                        <div 
                          onClick={() => setActiveTarget('firewall')}
                          class={`cursor-pointer transition-all duration-300 p-3 rounded-xl border relative z-10 flex items-center justify-between ${
                            activeTarget === 'firewall' 
                              ? 'bg-red-600/40 border-red-400 ring-4 ring-red-500/40 scale-[1.02]' 
                              : 'bg-slate-800/80 border-slate-700 hover:border-slate-500'
                          }`}
                        >
                          <div class="flex items-center gap-3">
                            <div class="p-2.5 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30">
                              <Icon name="shield-alert" size={24} />
                            </div>
                            <div>
                              <div class="text-xs text-red-300 font-semibold">2단계: 기관 보안영역 (학교/회사 방화벽)</div>
                              <div class="text-sm font-bold text-red-200">내부 보안 시스템 & 포트 차단 여부</div>
                            </div>
                          </div>
                          {activeTarget === 'firewall' && (
                            <span class="bg-red-500 text-white text-[11px] font-bold px-2.5 py-1 rounded-full animate-bounce-pointer">
                              👈 점검 대상
                            </span>
                          )}
                        </div>

                        {/* Connection Line 2 */}
                        <div class="h-6 flex justify-center items-center my-1 relative z-0">
                          <div class={`w-1 h-full transition-colors ${activeTarget === 'firewall' || activeTarget === 'switch' ? 'bg-blue-400' : 'bg-slate-700'}`}></div>
                        </div>

                        {/* Switch Rack */}
                        <div 
                          onClick={() => setActiveTarget('switch')}
                          class={`cursor-pointer transition-all duration-300 p-3 rounded-xl border relative z-10 flex items-center justify-between ${
                            activeTarget === 'switch' 
                              ? 'bg-amber-600/40 border-amber-400 ring-4 ring-amber-500/40 scale-[1.02]' 
                              : 'bg-slate-800/80 border-slate-700 hover:border-slate-500'
                          }`}
                        >
                          <div class="flex items-center gap-3">
                            <div class="p-2.5 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/30">
                              <Icon name="server" size={24} />
                            </div>
                            <div>
                              <div class="text-xs text-amber-300 font-semibold">3단계: 응시장 네트워크 스위치 (Switch)</div>
                              <div class="text-sm font-bold">1G / 기가비트 스위치 허브 장비</div>
                            </div>
                          </div>
                          {activeTarget === 'switch' && (
                            <span class="bg-amber-500 text-white text-[11px] font-bold px-2.5 py-1 rounded-full animate-bounce-pointer">
                              👈 점검 대상
                            </span>
                          )}
                        </div>

                        {/* Connection Line 3 Branching */}
                        <div class="h-6 flex justify-center items-center my-1 relative z-0">
                          <div class={`w-1 h-full transition-colors ${activeTarget === 'switch' || activeTarget === 'pc' ? 'bg-blue-400' : 'bg-slate-700'}`}></div>
                        </div>

                        {/* Bottom: Desktop PCs & UTP Cables */}
                        <div 
                          onClick={() => setActiveTarget('pc')}
                          class={`cursor-pointer transition-all duration-300 p-3 rounded-xl border relative z-10 flex items-center justify-between ${
                            activeTarget === 'pc' 
                              ? 'bg-emerald-600/40 border-emerald-400 ring-4 ring-emerald-500/40 scale-[1.02]'

                {progressPercent === 100 ? (
                  <span class="text-emerald-600 font-bold flex items-center gap-1.5">
                    <Icon name="check-circle-2" size={18} /> 모든 사전 점검이 완벽하게 완료되었습니다!
                  </span>
                ) : (
                  <span>
                    사전 점검 진행 상황: <strong class="text-blue-600 font-bold text-base">{completedCount}</strong> / {totalChecks} 개 항목 완료
                  </span>
                )}
              </div>

              <div class="flex items-center gap-2 w-full sm:w-auto">
                <button 
                  onClick={() => {
                    const text = `[오프라인 응시장 사전 점검 결과]\n완료 항목: ${completedCount}/${totalChecks} (${progressPercent}%)\n점검 일시: ${new Date().toLocaleDateString()}`;
                    if (navigator.clipboard) {
                      navigator.clipboard.writeText(text);
                      alert('점검 결과 요약이 클립보드에 복사되었습니다.');
                    } else {
                      alert(text);
                    }
                  }}
                  class="flex-1 sm:flex-initial px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all"
                >
                  <Icon name="copy" size={15} /> 결과 요약 복사
                </button>

                <button 
                  onClick={() => window.print()}
                  class="flex-1 sm:flex-initial px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-md transition-all"
                >
                  <Icon name="file-text" size={15} /> 점검표 출력하기
                </button>
              </div>

            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
